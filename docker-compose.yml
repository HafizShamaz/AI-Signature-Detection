
services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: signature
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: signature_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signature -d signature_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: redis://redis:6379/0
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN}
      AWS_ENDPOINT_URL_S3: ${AWS_ENDPOINT_URL_S3:?Required}
      AWS_REGION: ${AWS_REGION:?Required}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Required}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Required}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?Required}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command:
      - python
      - -m
      - celery
      - -A
      - shared.celery_app:celery_app
      - worker
      - --loglevel=info
      - --concurrency=1
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: redis://redis:6379/0
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN}
      AWS_ENDPOINT_URL_S3: ${AWS_ENDPOINT_URL_S3:?Required}
      AWS_REGION: ${AWS_REGION:?Required}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Required}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Required}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?Required}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  postgres_data:
  uploads_data:
