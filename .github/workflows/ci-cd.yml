
name: Signature AI CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  RESOURCE_GROUP: signature-ai-rg
  ACR_NAME: signatureairegistry2026
  ACR_LOGIN_SERVER: signatureairegistry2026.azurecr.io
  API_APP: signature-ai-api-v2
  WORKER_APP: signature-ai-worker-v2

jobs:
  validate:
    name: Python Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt
          pip install pytest

      - name: Run tests
        run: |
          python -m pytest tests/ -v

  deploy:
    name: Build and Deploy to Azure
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build API image
        run: |
          docker build \
            -f docker/api.Dockerfile \
            -t "$ACR_LOGIN_SERVER/signature-api:$GITHUB_SHA" \
            -t "$ACR_LOGIN_SERVER/signature-api:latest" .

      - name: Build Worker image
        run: |
          docker build \
            -f docker/worker.Dockerfile \
            -t "$ACR_LOGIN_SERVER/signature-worker:$GITHUB_SHA" \
            -t "$ACR_LOGIN_SERVER/signature-worker:latest" .

      - name: Push images to ACR
        run: |
          docker push "$ACR_LOGIN_SERVER/signature-api:$GITHUB_SHA"
          docker push "$ACR_LOGIN_SERVER/signature-api:latest"
          docker push "$ACR_LOGIN_SERVER/signature-worker:$GITHUB_SHA"
          docker push "$ACR_LOGIN_SERVER/signature-worker:latest"

      - name: Deploy API
        run: |
          az containerapp update \
            --name "$API_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/signature-api:$GITHUB_SHA"

      - name: Deploy Worker
        run: |
          az containerapp update \
            --name "$WORKER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/signature-worker:$GITHUB_SHA"

      - name: Verify API health
        run: |
          API_URL="https://signature-ai-api-v2.whitesand-1793c8f9.uaenorth.azurecontainerapps.io/health"

          for attempt in {1..12}; do
            if curl --fail --silent "$API_URL"; then
              echo "API health check successful"
              exit 0
            fi

            echo "Waiting for API... attempt $attempt"
            sleep 10
          done

          echo "API health check failed"
          exit 1
